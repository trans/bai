name: Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  arch:
    name: Arch Package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            crystal openssl pcre2 gc gcc-libs zlib brotli zstd

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          if [ "${{ github.event_name }}" = "release" ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match shard.yml version v$version"
            exit 1
          fi

      - name: Build Arch package with makepkg
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          mkdir -p pkg
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" ls-files -z | tar --null -T - \
            --transform "s,^,bai-${version}/," \
            -czf "pkg/bai-${version}.tar.gz"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/pkg' && makepkg -f --noconfirm"

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v6
        with:
          name: bai-arch
          path: pkg/*.pkg.tar.zst

  deb:
    name: Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Crystal and build dependencies
        run: |
          curl -fsSL https://crystal-lang.org/install.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y \
            crystal build-essential \
            libssl-dev libpcre2-dev libgc-dev zlib1g-dev \
            libbrotli-dev libzstd-dev \
            dpkg-dev debhelper

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          if [ "${{ github.event_name }}" = "release" ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match shard.yml version v$version"
            exit 1
          fi

      - name: Prepare Debian packaging
        run: ln -s pkg/debian debian

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect Debian artifacts
        run: |
          mkdir -p dist
          cp ../bai_*.deb dist/
          cp ../bai_*.buildinfo dist/ 2>/dev/null || true
          cp ../bai_*.changes dist/ 2>/dev/null || true

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v6
        with:
          name: bai-deb
          path: dist/*

  fedora:
    name: Fedora Package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git and curl for checkout and Crystal setup
        run: dnf install -y curl git

      - uses: actions/checkout@v5

      - name: Install Crystal from the official repository
        run: curl -fsSL https://crystal-lang.org/install.sh | bash

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            brotli-devel gc-devel gcc libzstd-devel \
            openssl-devel pcre2-devel redhat-rpm-config rpm-build zlib-devel

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          if [ "${{ github.event_name }}" = "release" ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match shard.yml version v$version"
            exit 1
          fi

      - name: Build Fedora package
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          mkdir -p dist pkg/rpmbuild/BUILD pkg/rpmbuild/BUILDROOT pkg/rpmbuild/RPMS pkg/rpmbuild/SOURCES pkg/rpmbuild/SPECS pkg/rpmbuild/SRPMS
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" ls-files -z | tar --null -T - \
            --transform "s,^,bai-${version}/," \
            -czf "pkg/rpmbuild/SOURCES/bai-${version}.tar.gz"
          cp pkg/bai.spec pkg/rpmbuild/SPECS/
          rpmbuild --define "_topdir $GITHUB_WORKSPACE/pkg/rpmbuild" -ba "$GITHUB_WORKSPACE/pkg/rpmbuild/SPECS/bai.spec"
          find pkg/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;

      - name: Upload Fedora artifact
        uses: actions/upload-artifact@v6
        with:
          name: bai-rpm
          path: dist/*

  release-assets:
    name: Upload Release Assets
    if: github.event_name == 'release'
    needs: [arch, deb, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bai-arch/*.pkg.tar.zst
            bai-deb/*.deb
            bai-rpm/*.rpm
